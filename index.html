<style>
:root{--bg:#E7EAE5;--surface:#FBFCF9;--ink:#1C2A2C;--muted:#56666A;--line:#D2D7CF;--accent:#1F5A57;--red:#A24536;}
*{box-sizing:border-box;}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;align-items:center;justify-content:center;padding:24px 16px;}
.box{width:100%;max-width:380px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:24px 20px;}

label{display:flex;align-items:center;gap:8px;margin:12px 0 16px;font-size:14px;color:var(--muted);}
input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent);}
button{width:100%;font-size:16px;font-weight:600;padding:12px;border:none;border-radius:11px;background:var(--accent);color:#fff;}
button:disabled{opacity:.6;}
#err{color:var(--red);font-size:14px;margin:12px 0 0;min-height:1em;}
.vh{position:absolute;left:-9999px;width:1px;height:1px;opacity:0;}
</style>

  var KEY = "bl_key";
  if("serviceWorker" in navigator && window.isSecureContext && location.protocol !== "file:"){ navigator.serviceWorker.register("sw.js").catch(function(){}); }
  function b64(s){ var b = atob(s), u = new Uint8Array(b.length); for(var i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; }
  function enc64(u){ var s = ""; for(var i = 0; i < u.length; i++) s += String.fromCharCode(u[i]); return btoa(s); }
  function norm(pw){ return pw.toLowerCase().replace(/[\s\-–_.]/g, ""); }
  function derive(pw){
    return crypto.subtle.importKey("raw", new TextEncoder().encode(norm(pw)), "PBKDF2", false, ["deriveBits"]).then(function(base){
      return crypto.subtle.deriveBits({name:"PBKDF2", salt:b64(P.salt), iterations:P.it, hash:"SHA-256"}, base, 256); }).then(function(bits){ return new Uint8Array(bits); });
  }
  function decrypt(raw){
    return crypto.subtle.importKey("raw", raw, "AES-GCM", false, ["decrypt"]).then(function(k){
      return crypto.subtle.decrypt({name:"AES-GCM", iv:b64(P.iv)}, k, b64(P.ct)); }).then(function(pt){ return new TextDecoder().decode(pt); });
  }
  function show(html){ // erst ersetzen, wenn die Sperrseite fertig geladen ist – sonst würde die App nur angehängt

  var err = document.getElementById("err"), go = document.getElementById("go");

  }
  document.getElementById("f").addEventListener("submit", function(ev){
